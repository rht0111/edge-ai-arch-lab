site_name: Edge AI Architecture Lab
site_description: Hands-on lab on Transformer accelerators for edge devices
site_author: Rohit Prasad
site_url: https://rht0111.github.io/edge-ai-arch-lab/
repo_url: https://github.com/rht0111/edge-ai-arch-lab
repo_name: rht0111/edge-ai-arch-lab
edit_uri: ""
copyright: >
  Rohit Prasad, CEA-LIST.
  Text CC BY 4.0, code MIT.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      primary: indigo
      toggle: {icon: material/brightness-4, name: Light mode}

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.tasklist: {custom_checkbox: true}

nav:
  - Home: index.md
  - Setup: setup.md
  - Labs:
      - "Lab 0: Profile a Transformer": labs/lab0.md
      - "Lab 1: Roofline and tiling": labs/lab1.md
      - "Lab 2: Systolic arrays": labs/lab2.md
      - "Lab 3: Non-linear functions": labs/lab3.md
      - "Lab 4: Design challenge": labs/lab4.md
  - Going further: going-further.md
  - References: references.md
