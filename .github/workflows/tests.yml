name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  # The notebooks on main are stubs, so the lab checks and a full run of the
  # notebooks only make sense on the branch that holds the reference solutions.
  solutions:
    if: github.ref_name == 'solutions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Expected values are up to date
        run: |
          python scripts/make_expected.py
          git diff --exit-code archsim/data/expected.json
      - name: Lab checks
        run: pytest tests -q
      - name: Execute every notebook top to bottom
        working-directory: labs
        run: |
          for nb in *.ipynb; do
            start=$(date +%s)
            jupyter nbconvert --to notebook --execute "$nb" \
              --output-dir "$RUNNER_TEMP/executed" --ExecutePreprocessor.timeout=120
            echo "$nb: $(( $(date +%s) - start )) s"
          done
