name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  # Lab checks and full notebook runs need the solved notebooks, which exist
  # only where nbsrc/ is present (master, solutions). The students version
  # has stubs, so there this job only reports that it skipped them.
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: kind
        run: echo "full=$([ -d nbsrc ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.kind.outputs.full != 'true'
        run: echo "Student version, lab checks skipped."
      - if: steps.kind.outputs.full == 'true'
        run: pip install -e ".[dev]"
      - name: Notebooks and expected values match the sources
        if: steps.kind.outputs.full == 'true'
        run: |
          python scripts/build_notebooks.py --solutions
          python scripts/make_expected.py
          git diff --exit-code labs archsim/data/expected.json
      - name: Lab checks
        if: steps.kind.outputs.full == 'true'
        run: pytest tests -q
      - name: Execute every notebook top to bottom
        if: steps.kind.outputs.full == 'true'
        working-directory: labs
        run: |
          for nb in *.ipynb; do
            start=$(date +%s)
            jupyter nbconvert --to notebook --execute "$nb" \
              --output-dir "$RUNNER_TEMP/executed" --ExecutePreprocessor.timeout=120
            echo "$nb: $(( $(date +%s) - start )) s"
          done
